<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Trading Terminal{% endblock %}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 0; }
        .container { max-width: 900px; margin: auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); overflow: hidden; margin-top: 20px;}
        header { background-color: #007bff; color: white; padding: 20px; text-align: center; }
        h1, h2 { margin: 0; }
        h2 { color: #007bff; border-bottom: 2px solid #f4f6f9; padding-bottom: 10px; margin-bottom: 15px; font-size: 1.2em;}
        .content { padding: 20px; }
        .nav { background-color: #343a40; padding: 10px 0; }
        .nav ul { list-style: none; margin: 0; padding: 0; text-align: center; }
        .nav ul li { display: inline; margin: 0 15px; }
        .nav ul li a { color: white; text-decoration: none; font-weight: bold; }
        .nav ul li a.active { text-decoration: underline; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <h1>Trading Terminal</h1>
    </header>
    <nav class="nav">
        <ul>
            <li><a href="/" class="{{ 'active' if request.path == '/' else '' }}">Home</a></li>
            <li><a href="/strategy" class="{{ 'active' if request.path == '/strategy' else '' }}">Trading Strategy</a></li>
            <li><a href="/backtesting" class="{{ 'active' if request.path == '/backtesting' else '' }}">Backtesting</a></li>
        </ul>
    </nav>
    <div class="container">
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
