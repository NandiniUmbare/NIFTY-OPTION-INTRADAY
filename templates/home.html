{% extends "base.html" %}
{% block title %}Home - Trading Terminal{% endblock %}

{% block head %}
<style>
    .data-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .data-item { background: #f4f6f9; padding: 15px; border-radius: 5px; }
    .data-item strong { color: #555; display: block; margin-bottom: 5px; }
    .data-item span { font-weight: bold; font-size: 1.1em; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
    th { background-color: #007bff; color: white; }
    tr:nth-child(even) { background-color: #f2f2f2; }
</style>
{% endblock %}

{% block content %}
    <div class="panel">
        <h2>Account Summary</h2>
        <div class="data-grid">
            <div class="data-item"><strong>Available Funds:</strong> <span id="funds">--</span></div>
            <div class="data-item"><strong>Today's P&L:</strong> <span id="pnl">--</span></div>
        </div>
    </div>

    <div class="panel">
        <h2>Open Positions</h2>
        <div id="open-positions-table"></div>
    </div>

    <div class="panel">
        <h2>Holdings</h2>
        <div id="holdings-table"></div>
    </div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const statusInterval = setInterval(updateStatus, 2500);

        function updateStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    updateAccountUI(data.account);
                })
                .catch(error => console.error('Error fetching status:', error));
        }

        function updateAccountUI(account) {
            if (!account) return;
            document.getElementById('funds').textContent = account.funds !== undefined ? `₹${Number(account.funds).toLocaleString()}` : '--';
            document.getElementById('pnl').textContent = account.pnl !== undefined ? `₹${Number(account.pnl).toLocaleString()}` : '--';

            createTable('open-positions-table', ['Symbol', 'Qty', 'P&L'], account.positions, item => [item.tradingsymbol, item.quantity, `₹${item.pnl.toFixed(2)}`]);
            createTable('holdings-table', ['Symbol', 'Qty', 'Avg. Price'], account.holdings, item => [item.tradingsymbol, item.quantity, `₹${item.average_price.toFixed(2)}`]);
        }

        function createTable(containerId, headers, data, rowMapper) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (!data || data.length === 0) {
                container.textContent = `No ${containerId.replace('-table', '').replace('-', ' ')} found.`;
                return;
            }

            const table = document.createElement('table');
            const thead = table.createTHead();
            const tbody = table.createTBody();
            let row = thead.insertRow();
            headers.forEach(headerText => {
                let th = document.createElement('th');
                th.textContent = headerText;
                row.appendChild(th);
            });

            data.forEach(item => {
                row = tbody.insertRow();
                rowMapper(item).forEach(cellData => {
                    let cell = row.insertCell();
                    cell.textContent = cellData;
                });
            });
            container.appendChild(table);
        }

        updateStatus();
    });
</script>
{% endblock %}
